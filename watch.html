<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Tic Tac Toe - Mohd Ashhad</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            #6366f1 0%,
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 90%,
            #ec4899 0%,
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #1e1b4b
        );

    overflow-x: hidden;
}


/* =====================================================
   GAME CONTAINER
===================================================== */

.game {

    width: 100%;

    max-width: 460px;

    /*
       Height automatically adapts.
       It will never become taller than screen.
    */
    max-height: calc(100dvh - 16px);

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        clamp(12px, 2.8vh, 24px)
        clamp(12px, 4vw, 24px);

    border-radius:
        clamp(18px, 4vw, 28px);

    background: rgba(255,255,255,.97);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4),
        0 0 0 1px rgba(255,255,255,.15);

    scrollbar-width: none;
}

.game::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;

    margin-bottom:
        clamp(7px, 1.8vh, 17px);
}

.header h1 {

    font-size:
        clamp(
            24px,
            min(8vw, 4.5vh),
            38px
        );

    line-height: 1.05;

    font-weight: 900;

    color: #111827;
}

.header p {

    margin-top: 4px;

    color: #6b7280;

    font-size:
        clamp(
            10px,
            min(3.2vw, 1.8vh),
            14px
        );
}


/* =====================================================
   PLAYERS
===================================================== */

.players {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        clamp(5px, 1.5vw, 10px);

    margin-bottom:
        clamp(6px, 1.5vh, 12px);
}

.player {

    min-width: 0;

    padding:
        clamp(6px, 1.5vh, 12px)
        clamp(6px, 2vw, 12px);

    border-radius:
        clamp(10px, 3vw, 16px);

    border:
        2px solid transparent;

    background: #f3f4f6;

    transition: .2s;
}

.player.active {

    background: #eef2ff;

    border-color: #6366f1;

    box-shadow:
        0 4px 12px rgba(99,102,241,.15);
}

.player-title {

    text-align: center;

    color: #6b7280;

    font-size:
        clamp(
            9px,
            min(2.7vw, 1.6vh),
            12px
        );

    font-weight: 800;

    margin-bottom: 4px;
}

.player input {

    width: 100%;

    min-width: 0;

    height:
        clamp(
            31px,
            min(8vw, 4.5vh),
            42px
        );

    border:
        1.5px solid #e5e7eb;

    border-radius: 9px;

    outline: none;

    background: white;

    color: #111827;

    padding: 0 5px;

    text-align: center;

    font-size:
        clamp(
            10px,
            min(3.2vw, 1.8vh),
            14px
        );
}

.player input:focus {
    border-color: #6366f1;
}

.symbol {

    text-align: center;

    font-size:
        clamp(
            17px,
            min(5vw, 3vh),
            25px
        );

    font-weight: 900;

    line-height: 1;

    margin-top: 3px;
}

.x-symbol {
    color: #ef4444;
}

.o-symbol {
    color: #2563eb;
}


/* =====================================================
   SCORE
===================================================== */

.score {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 6px;

    margin-bottom:
        clamp(5px, 1.3vh, 10px);
}

.score-box {

    min-width: 0;

    text-align: center;

    padding:
        clamp(4px, 1vh, 7px)
        5px;

    border-radius: 10px;

    background: #f8fafc;

    border:
        1px solid #e5e7eb;
}

.score-name {

    display: block;

    width: 100%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    color: #6b7280;

    font-size:
        clamp(
            9px,
            min(2.8vw, 1.6vh),
            12px
        );

    font-weight: 700;
}

.score-number {

    display: block;

    color: #4f46e5;

    font-size:
        clamp(
            18px,
            min(5.5vw, 3.2vh),
            26px
        );

    line-height: 1.05;

    font-weight: 900;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    width: 100%;

    min-height:
        clamp(
            32px,
            min(9vw, 5vh),
            45px
        );

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 4px 8px;

    margin-bottom:
        clamp(5px, 1.3vh, 11px);

    border-radius: 11px;

    background: #f3f4f6;

    color: #111827;

    font-size:
        clamp(
            11px,
            min(3.5vw, 2vh),
            16px
        );

    font-weight: 800;
}


/* =====================================================
   BOARD
===================================================== */

.board {

    width: 100%;

    /*
       Width AND height both controlled.
       This is the important responsive part.
    */

    max-width:
        min(
            390px,
            calc(100vw - 45px),
            calc(100dvh - 250px)
        );

    aspect-ratio: 1 / 1;

    margin:
        0 auto;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap:
        clamp(
            5px,
            min(2vw, 1.2vh),
            10px
        );
}


/* =====================================================
   CELLS
===================================================== */

.cell {

    width: 100%;

    aspect-ratio: 1 / 1;

    border: none;

    border-radius:
        clamp(
            9px,
            min(3vw, 1.8vh),
            17px
        );

    background: #f1f5f9;

    box-shadow:
        inset 0 0 0 2px #e2e8f0,
        0 4px 8px rgba(0,0,0,.05);

    font-size:
        clamp(
            35px,
            min(14vw, 8vh),
            68px
        );

    line-height: 1;

    font-weight: 900;

    cursor: pointer;

    user-select: none;

    transition:
        transform .12s ease,
        background .15s ease;
}

.cell:hover {
    background: #e5e7eb;
}

.cell:active {
    transform: scale(.92);
}

.cell.x {
    color: #ef4444;
}

.cell.o {
    color: #2563eb;
}


/* =====================================================
   WINNER
===================================================== */

.cell.winner {

    color: #15803d !important;

    background: #bbf7d0;

    box-shadow:
        0 0 0 2px #22c55e,
        0 0 18px rgba(34,197,94,.45);

    animation:
        winnerAnimation .55s infinite alternate;
}

@keyframes winnerAnimation {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
    }
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 6px;

    margin-top:
        clamp(6px, 1.4vh, 12px);
}

.control,
.voice-btn {

    width: 100%;

    min-height:
        clamp(
            34px,
            min(10vw, 5vh),
            48px
        );

    border: none;

    border-radius: 11px;

    color: white;

    font-size:
        clamp(
            10px,
            min(3.5vw, 2vh),
            15px
        );

    font-weight: 800;

    cursor: pointer;

    transition: .15s;
}

.control:active,
.voice-btn:active {
    transform: scale(.96);
}

.new-game {
    background:
        linear-gradient(
            135deg,
            #6366f1,
            #4f46e5
        );
}

.reset {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );
}


/* =====================================================
   VOICE
===================================================== */

.voice-btn {

    margin-top: 6px;

    background: #111827;
}

.voice-btn.off {
    background: #6b7280;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    margin-top:
        clamp(7px, 1.5vh, 13px);

    padding-top:
        clamp(6px, 1.2vh, 10px);

    border-top:
        1px solid #e5e7eb;

    color: #9ca3af;

    font-size:
        clamp(
            9px,
            min(2.8vw, 1.5vh),
            12px
        );
}

.footer strong {
    color: #4f46e5;
}


/* =====================================================
   VERY SHORT PHONES
   568px HEIGHT OR LESS
===================================================== */

@media (max-height: 568px) {

    .game {
        padding-top: 9px;
        padding-bottom: 9px;
    }

    .header {
        margin-bottom: 6px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        display: none;
    }

    .players {
        margin-bottom: 5px;
    }

    .player {
        padding: 5px;
    }

    .player-title {
        margin-bottom: 2px;
    }

    .symbol {
        display: none;
    }

    .score {
        margin-bottom: 5px;
    }

    .status {
        margin-bottom: 5px;
    }

    .buttons {
        margin-top: 5px;
    }

    .voice-btn {
        margin-top: 5px;
    }

    .footer {
        margin-top: 6px;
        padding-top: 5px;
    }
}


/* =====================================================
   EXTRA SHORT PHONES
   480px HEIGHT OR LESS
===================================================== */

@media (max-height: 480px) {

    body {
        align-items: flex-start;
    }

    .game {
        margin-top: 3px;
        max-height: calc(100dvh - 6px);
    }

    .header h1 {
        font-size: 21px;
    }

    .players {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .player input {
        height: 28px;
    }

    .score-box {
        padding: 3px;
    }

    .score-number {
        font-size: 18px;
    }

    .status {
        min-height: 28px;
        font-size: 11px;
    }

    .board {

        max-width:
            min(
                250px,
                calc(100vw - 35px),
                calc(100dvh - 180px)
            );
    }

    .buttons {
        margin-top: 4px;
    }

    .control,
    .voice-btn {
        min-height: 30px;
        border-radius: 8px;
    }

    .footer {
        display: none;
    }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media
(max-height: 600px)
and
(orientation: landscape) {

    body {
        align-items: flex-start;
        padding: 5px;
    }

    .game {

        max-width: 500px;

        max-height:
            calc(100dvh - 10px);

        margin: auto;

        padding:
            8px 15px;
    }

    .header {
        margin-bottom: 5px;
    }

    .header h1 {
        font-size: 22px;
    }

    .header p {
        display: none;
    }

    .players {
        margin-bottom: 4px;
    }

    .player {
        padding: 4px;
    }

    .symbol {
        display: none;
    }

    .player input {
        height: 28px;
    }

    .score {
        margin-bottom: 4px;
    }

    .score-box {
        padding: 3px;
    }

    .score-number {
        font-size: 18px;
    }

    .status {
        min-height: 27px;
        margin-bottom: 4px;
    }

    .board {

        max-width:
            min(
                245px,
                calc(100vw - 35px),
                calc(100dvh - 155px)
            );
    }

    .buttons {
        margin-top: 4px;
    }

    .control,
    .voice-btn {
        min-height: 29px;
    }

    .voice-btn {
        margin-top: 4px;
    }

    .footer {
        display: none;
    }
}


/* =====================================================
   LARGE PHONES / TABLETS
===================================================== */

@media (min-width: 600px) {

    .game {
        max-width: 480px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 900px) {

    .game {
        max-width: 500px;
    }

    .cell:hover {
        transform: translateY(-2px);
    }
}

</style>
</head>


<body>


<div class="game">


    <!-- HEADER -->

    <header class="header">

        <h1>
            ❌ Tic-Tac-Toe ⭕
        </h1>

        <p>
            Challenge Your Friend
        </p>

    </header>


    <!-- PLAYERS -->

    <section class="players">


        <div
            class="player active"
            id="playerX"
        >

            <div class="player-title">
                PLAYER 1
            </div>

            <input
                id="nameX"
                type="text"
                placeholder="Your Name"
                maxlength="15"
                autocomplete="off"
            >

            <div class="symbol x-symbol">
                X
            </div>

        </div>


        <div
            class="player"
            id="playerO"
        >

            <div class="player-title">
                PLAYER 2
            </div>

            <input
                id="nameO"
                type="text"
                placeholder="Your Name"
                maxlength="15"
                autocomplete="off"
            >

            <div class="symbol o-symbol">
                O
            </div>

        </div>


    </section>


    <!-- SCORE -->

    <section class="score">


        <div class="score-box">

            <span
                class="score-name"
                id="scoreNameX"
            >
                Player X
            </span>

            <span
                class="score-number"
                id="scoreX"
            >
                0
            </span>

        </div>


        <div class="score-box">

            <span
                class="score-name"
                id="scoreNameO"
            >
                Player O
            </span>

            <span
                class="score-number"
                id="scoreO"
            >
                0
            </span>

        </div>


    </section>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        Player X की turn
    </div>


    <!-- BOARD -->

    <section class="board">

        <button
            class="cell"
            data-index="0"
        ></button>

        <button
            class="cell"
            data-index="1"
        ></button>

        <button
            class="cell"
            data-index="2"
        ></button>


        <button
            class="cell"
            data-index="3"
        ></button>

        <button
            class="cell"
            data-index="4"
        ></button>

        <button
            class="cell"
            data-index="5"
        ></button>


        <button
            class="cell"
            data-index="6"
        ></button>

        <button
            class="cell"
            data-index="7"
        ></button>

        <button
            class="cell"
            data-index="8"
        ></button>

    </section>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="control new-game"
            id="newGame"
        >
            🔄 New Game
        </button>


        <button
            class="control reset"
            id="resetScore"
        >
            🗑️ Reset
        </button>

    </div>


    <!-- VOICE -->

    <button
        class="voice-btn"
        id="voiceButton"
    >
        🔊 Voice ON
    </button>


    <!-- FOOTER -->

    <footer class="footer">

        Created with ❤️ by
        <strong>Mohd Ashhad</strong>

    </footer>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const cells =
    document.querySelectorAll(".cell");

const statusText =
    document.getElementById("status");

const nameX =
    document.getElementById("nameX");

const nameO =
    document.getElementById("nameO");

const scoreXText =
    document.getElementById("scoreX");

const scoreOText =
    document.getElementById("scoreO");

const scoreNameX =
    document.getElementById("scoreNameX");

const scoreNameO =
    document.getElementById("scoreNameO");

const playerXBox =
    document.getElementById("playerX");

const playerOBox =
    document.getElementById("playerO");

const newGameButton =
    document.getElementById("newGame");

const resetScoreButton =
    document.getElementById("resetScore");

const voiceButton =
    document.getElementById("voiceButton");


/* =====================================================
   GAME VARIABLES
===================================================== */

let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let currentPlayer = "X";

let gameRunning = true;

let scoreX = 0;

let scoreO = 0;

let voiceEnabled = true;


/* =====================================================
   WINNING PATTERNS
===================================================== */

const winningPatterns = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];


/* =====================================================
   PLAYER NAME
===================================================== */

function getName(player) {

    if (player === "X") {

        return (
            nameX.value.trim() ||
            "Player X"
        );

    }

    return (
        nameO.value.trim() ||
        "Player O"
    );
}


/* =====================================================
   VOICE
===================================================== */

function speak(text) {

    if (!voiceEnabled) {
        return;
    }

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "hi-IN";

    speech.rate = .95;

    speech.pitch = 1;

    speech.volume = 1;

    speechSynthesis.speak(speech);
}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI() {

    scoreNameX.textContent =
        getName("X");

    scoreNameO.textContent =
        getName("O");


    if (currentPlayer === "X") {

        playerXBox
            .classList
            .add("active");

        playerOBox
            .classList
            .remove("active");

    } else {

        playerOBox
            .classList
            .add("active");

        playerXBox
            .classList
            .remove("active");
    }
}


/* =====================================================
   TURN
===================================================== */

function nextTurn(useVoice = true) {

    const name =
        getName(currentPlayer);

    statusText.textContent =
        `${name} (${currentPlayer}) की turn`;

    updateUI();

    if (useVoice) {

        speak(
            `${name} की बारी है`
        );
    }
}


/* =====================================================
   CELL CLICK
===================================================== */

cells.forEach(cell => {

    cell.addEventListener(
        "click",
        () => {

            const index =
                Number(cell.dataset.index);


            if (
                !gameRunning ||
                board[index] !== ""
            ) {
                return;
            }


            board[index] =
                currentPlayer;


            cell.textContent =
                currentPlayer;


            cell.classList.add(
                currentPlayer === "X"
                    ? "x"
                    : "o"
            );


            checkWinner();

        }
    );

});


/* =====================================================
   CHECK WINNER
===================================================== */

function checkWinner() {

    for (
        const pattern
        of winningPatterns
    ) {

        const [a, b, c] =
            pattern;


        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            winGame(pattern);

            return;
        }

    }


    /* DRAW */

    if (!board.includes("")) {

        gameRunning = false;

        statusText.textContent =
            "🤝 Game Draw हो गया!";

        speak(
            "गेम ड्रॉ हो गया"
        );

        return;
    }


    /* NEXT PLAYER */

    currentPlayer =
        currentPlayer === "X"
            ? "O"
            : "X";


    nextTurn(true);
}


/* =====================================================
   WIN
===================================================== */

function winGame(pattern) {

    gameRunning = false;


    const winner =
        currentPlayer;

    const winnerName =
        getName(winner);


    pattern.forEach(index => {

        cells[index]
            .classList
            .add("winner");

    });


    if (winner === "X") {

        scoreX++;

        scoreXText.textContent =
            scoreX;

    } else {

        scoreO++;

        scoreOText.textContent =
            scoreO;
    }


    statusText.textContent =
        `🎉 ${winnerName} जीत गया!`;


    speak(
        `बधाई हो ${winnerName}, आप जीत गए`
    );
}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];


    currentPlayer = "X";

    gameRunning = true;


    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove("x");

        cell.classList.remove("o");

        cell.classList.remove("winner");

    });


    nextTurn(false);

    speak(
        `${getName("X")} की बारी है`
    );
}


/* =====================================================
   RESET SCORE
===================================================== */

function resetScore() {

    scoreX = 0;

    scoreO = 0;


    scoreXText.textContent =
        "0";

    scoreOText.textContent =
        "0";


    newGame();
}


/* =====================================================
   VOICE BUTTON
===================================================== */

voiceButton.addEventListener(
    "click",
    () => {

        voiceEnabled =
            !voiceEnabled;


        if (voiceEnabled) {

            voiceButton.textContent =
                "🔊 Voice ON";

            voiceButton
                .classList
                .remove("off");

            speak(
                "वॉइस चालू है"
            );

        } else {

            speechSynthesis.cancel();

            voiceButton.textContent =
                "🔇 Voice OFF";

            voiceButton
                .classList
                .add("off");
        }

    }
);


/* =====================================================
   BUTTONS
===================================================== */

newGameButton.addEventListener(
    "click",
    newGame
);

resetScoreButton.addEventListener(
